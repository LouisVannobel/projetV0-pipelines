name: Release container

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-container-release.yml@e324a8e007871fc2ae8ee43a9a0c1fdae207e979 # v1.0.0
    with:
      registry-username: ${{ github.actor }}
      image: ghcr.io/louisvannobel/my-saas
      version: ${{ github.ref_name }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
