name: Release container

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-container-release.yml@f0d0533ed64c3ae4be2373d445fb00546cc8a04f # v1.0.0
    with:
      registry-username: ${{ github.actor }}
      image: ghcr.io/louisvannobel/my-saas
      version: ${{ github.ref_name }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
