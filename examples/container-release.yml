name: Release container

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-container-release.yml@b63d41bfe270b99ff69afa069f3c48fdfc4311d0 # v1.0.0
    with:
      registry-username: ${{ github.actor }}
      image: ghcr.io/louisvannobel/my-saas
      version: ${{ github.ref_name }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
