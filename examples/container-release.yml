name: Release container

on:
  push:
    branches: ["main"]

concurrency:
  group: container-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-container-release.yml@ea76863f0150367edd8ceeec9bf43661e28d1597 # v1.6.0

  deploy:
    needs: build
    permissions:
      contents: read
      id-token: write
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Join private deployment tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          version: '1.94.2'
          sha256sum: 'c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32'
          use-cache: 'false'
          oauth-client-id: ${{ vars.TS_WIF_CLIENT_ID }}
          audience: ${{ vars.TS_WIF_AUDIENCE }}
          tags: tag:deploy
      - name: Deploy verified digest through Dokploy
        uses: LouisVannobel/projetV0-pipelines/.github/actions/deploy-dokploy@ea76863f0150367edd8ceeec9bf43661e28d1597 # v1.6.0
        env:
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          EXPECTED_REVISION: ${{ github.sha }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          RELEASE_REF: ${{ needs.build.outputs.release-ref }}
