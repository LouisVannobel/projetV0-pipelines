name: Release container

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: LouisVannobel/projetV0-pipelines/.github/workflows/reusable-container-release.yml@000869f3edd295b10382a4fa72b5b387ecc702c6 # v1.0.0
    with:
      registry-username: ${{ github.actor }}
      image: ghcr.io/louisvannobel/my-saas
      version: ${{ github.ref_name }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
