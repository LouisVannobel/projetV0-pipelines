name: Reusable container release

on:
  workflow_call:
    inputs:
      docker-context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      platforms:
        type: string
        default: linux/amd64

permissions: {}

jobs:
  release:
    name: Build, publish, and scan immutable OCI image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: 'v0.36.1'
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Derive immutable release image
        id: release-image
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'RELEASE_IMAGE=%s\n' "$RELEASE_IMAGE" >> "$GITHUB_ENV"
          printf 'image=%s\n' "$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable revision
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.release-image.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Capture and validate published digest
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIGEST="${{ steps.build.outputs.digest }}"
          if [[ ! "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Build action did not return a valid immutable digest' >&2
            exit 1
          fi
          RELEASE_REF="${RELEASE_IMAGE}@${RELEASE_DIGEST}"
          printf 'RELEASE_DIGEST=%s\n' "$RELEASE_DIGEST" >> "$GITHUB_ENV"
          printf 'RELEASE_REF=%s\n' "$RELEASE_REF" >> "$GITHUB_ENV"
      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'image'
          image-ref: ${{ env.RELEASE_REF }}
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
