name: Reusable container release

on:
  workflow_call:
    inputs:
      docker-context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      platforms:
        type: string
        default: linux/amd64
    outputs:
      release-ref:
        description: Immutable image reference after a successful exact-digest scan
        value: ${{ jobs.release.outputs.release-ref }}
      digest:
        description: Immutable image digest after a successful exact-digest scan
        value: ${{ jobs.release.outputs.digest }}
permissions: {}

jobs:
  release:
    name: Build, publish, and scan immutable OCI image
    permissions:
      contents: read
      packages: write
    outputs:
      release-ref: ${{ steps.release-artifact.outputs.release-ref }}
      digest: ${{ steps.release-artifact.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: 'v0.37.1'
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Derive immutable release image
        id: release-image
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'RELEASE_IMAGE=%s\n' "$RELEASE_IMAGE" >> "$GITHUB_ENV"
          printf 'image=%s\n' "$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable revision
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          outputs: type=image,name=${{ steps.release-image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.11.0@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Capture and validate published digest
        id: release-artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_DIGEST="${{ steps.build.outputs.digest }}"
          if [[ ! "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Build action did not return a valid immutable digest' >&2
            exit 1
          fi
          RELEASE_REF="${RELEASE_IMAGE}@${RELEASE_DIGEST}"
          printf 'RELEASE_DIGEST=%s\n' "$RELEASE_DIGEST" >> "$GITHUB_ENV"
          printf 'RELEASE_REF=%s\n' "$RELEASE_REF" >> "$GITHUB_ENV"
          printf 'digest=%s\n' "$RELEASE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'release-ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"
      - name: Block fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'image'
          image-ref: ${{ env.RELEASE_REF }}
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
