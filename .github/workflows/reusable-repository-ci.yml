name: Reusable repository CI

on:
  workflow_call:
    inputs:
      run-infrastructure-static:
        description: Run repository-local infrastructure validation without deployment credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate GitHub Actions syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 does not yet parse GitHub's exact-ref $/ self-action syntax or concurrency queue.
          self_action_ignore='^specifying action "\$/\.github/actions/deploy-dokploy" in invalid format because ref is missing\. available formats are "\{owner\}/\{repo\}@\{ref\}" or "\{owner\}/\{repo\}/\{path\}@\{ref\}"$'
          queue_ignore='^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | sort -z \
            | xargs -0 --no-run-if-empty "$RUNNER_TEMP/actionlint" -ignore "$self_action_ignore" -ignore "$queue_ignore"
      - name: Scan the complete Git history for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          export PATH="$RUNNER_TEMP:$PATH"
          config=()
          [[ ! -f .gitleaks.toml ]] || config=(--config .gitleaks.toml)
          gitleaks git . "${config[@]}" --redact --no-banner --exit-code 1
      - name: Scan repository vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret,license'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  infrastructure-static:
    name: Infrastructure static validation
    if: inputs.run-infrastructure-static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infra tests -type f -name '*.sh' -print0 | sort -z)
      - name: Install checksum-pinned ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck_version=v0.11.0
          archive="shellcheck-${shellcheck_version}.linux.x86_64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/$archive"
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/shellcheck-${shellcheck_version}" >> "$GITHUB_PATH"
      - name: Lint shell sources
        shell: bash
        run: |
          set -Eeuo pipefail
          find infra tests -type f -name '*.sh' -print0 | sort -z \
            | xargs -0 --no-run-if-empty shellcheck --external-sources --severity=error
      - name: Run infrastructure CI contract tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/infra/test_shared_ci.ps1
      - name: Run shell library unit tests
        shell: bash
        run: bash tests/infra/test_lib.sh
      - name: Validate Compose models without runtime secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' compose_file; do
            docker compose --env-file infra/locks/images.env -f "$compose_file" \
              config --no-interpolate --quiet
          done < <(find infra/stacks -type f \( -name 'compose.yml' -o -name 'compose.yaml' \) -print0 | sort -z)
