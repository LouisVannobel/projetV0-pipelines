name: Validate pipelines

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test reusable workflow contracts
        shell: pwsh
        run: pwsh -File tests/test_pipeline_contracts.ps1
      - name: Validate GitHub Actions syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml examples/*.yml
      - name: Scan repository for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code 1

  repository-security:
    name: Reusable repository CI
    uses: ./.github/workflows/reusable-repository-ci.yml
