name: Reusable OCI release

on:
  workflow_call:
    inputs:
      registry:
        description: OCI registry host
        type: string
        default: ghcr.io
      registry-username:
        description: Least-privilege registry identity
        type: string
        required: true
      image:
        description: Fully-qualified lowercase image name without a tag
        type: string
        required: true
      version:
        description: Immutable release version or commit-derived identifier
        type: string
        required: true
      docker-context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64
    secrets:
      registry-password:
        description: Registry token permitted to push this image
        required: true
      registry-read-password:
        description: Registry token permitted only to read this image
        required: true
    outputs:
      image-digest:
        description: Promoted OCI root digest
        value: ${{ jobs.promote.outputs.image-digest }}
      image-reference:
        description: Canonical promoted reference
        value: ${{ jobs.promote.outputs.image-reference }}
      sbom-artifact:
        description: Uploaded SPDX SBOM artifact name
        value: ${{ jobs.promote.outputs.sbom-artifact }}

permissions: {}

jobs:
  build:
    name: Build canonical digest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-reference: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release inputs
        id: validate-inputs
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PLATFORMS" == "linux/amd64" ]]
          [[ "$REGISTRY" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?$ ]]
          [[ "$IMAGE" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$ ]]
          [[ "$IMAGE" == "$REGISTRY/"* ]]
          [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [[ "${VERSION,,}" != "latest" ]]
          [[ ! "${VERSION,,}" =~ ^sha-[0-9a-f]{40}$ ]]
      - name: Configure pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate for canonical push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password }}
      - name: Build and push untagged canonical digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.11.0@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Scan and verify canonical digest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: read
    env:
      IMAGE_REFERENCE: ${{ needs.build.outputs.image-reference }}
    steps:
      - name: Configure pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate read-only for verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-read-password }}
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REFERENCE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Export and validate attached attestations
        id: verify-attestations
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_REFERENCE" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+@sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --raw > root-index.json
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{ json .Provenance.SLSA }}' > provenance.slsa.json
          python3 - <<'PY'
          import json
          import re

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          with open("root-index.json", encoding="utf-8") as handle:
              root = json.load(handle)
          manifests = root.get("manifests") if isinstance(root, dict) else None
          if root.get("schemaVersion") != 2 or root.get("mediaType") != "application/vnd.oci.image.index.v1+json" or not isinstance(manifests, list):
              raise SystemExit("invalid OCI root index")
          runnable = [item for item in manifests if item.get("annotations", {}).get("vnd.docker.reference.type") != "attestation-manifest"]
          if len(runnable) != 1:
              raise SystemExit("expected exactly one runnable manifest")
          platform = runnable[0]
          platform_digest = platform.get("digest", "")
          if platform.get("mediaType") != "application/vnd.oci.image.manifest.v1+json" or platform.get("platform") != {"os": "linux", "architecture": "amd64"} or not digest_pattern.fullmatch(platform_digest):
              raise SystemExit("expected one linux/amd64 runnable manifest")
          linked = [item for item in manifests if item.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest" and item.get("annotations", {}).get("vnd.docker.reference.digest") == platform_digest]
          if len(linked) != 1 or linked[0].get("mediaType") != "application/vnd.oci.image.manifest.v1+json" or not digest_pattern.fullmatch(linked[0].get("digest", "")):
              raise SystemExit("expected one linked attestation descriptor")
          with open("sbom.spdx.json", encoding="utf-8") as handle:
              sbom = json.load(handle)
          if sbom.get("SPDXID") != "SPDXRef-DOCUMENT" or not str(sbom.get("spdxVersion", "")).startswith("SPDX-"):
              raise SystemExit("invalid SPDX predicate")
          with open("provenance.slsa.json", encoding="utf-8") as handle:
              provenance = json.load(handle)
          builder_id = provenance.get("runDetails", {}).get("builder", {}).get("id")
          if (provenance.get("buildDefinition", {}).get("buildType") != "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
                  or not isinstance(builder_id, str) or not builder_id.strip()):
              raise SystemExit("invalid SLSA predicate")
          PY
      - name: Upload validated SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
      - name: Upload validated SLSA provenance predicate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ github.sha }}
          path: provenance.slsa.json
          if-no-files-found: error

  promote:
    name: Promote verified digest
    needs:
      - build
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: projetv0-oci-promotion
      cancel-in-progress: false
      queue: max
    permissions:
      packages: write
    outputs:
      image-digest: ${{ steps.result.outputs.image-digest }}
      image-reference: ${{ steps.result.outputs.image-reference }}
      sbom-artifact: ${{ steps.result.outputs.sbom-artifact }}
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ needs.build.outputs.image-digest }}
      VERSION: ${{ inputs.version }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Configure pinned Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate for digest promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password }}
      - name: Promote the verified digest
        id: promote-image
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$ ]]
          [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [[ "${VERSION,,}" != "latest" ]]
          [[ ! "${VERSION,,}" =~ ^sha-[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          check_existing_tag() {
            local reference="$1"
            local existing_digest error_file
            local -a error_lines=()
            error_file="$(mktemp)"
            if existing_digest="$(docker buildx imagetools inspect "$reference" --format '{{ .Manifest.Digest }}' 2>"$error_file")"; then
              rm -f "$error_file"
              [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$existing_digest" == "$DIGEST" ]]
            else
              mapfile -t error_lines < <(grep -v '^[[:space:]]*$' "$error_file")
              if [[ "${#error_lines[@]}" -eq 1 ]] && {
                [[ "${error_lines[0]}" == "ERROR: $reference: not found" ]] \
                  || [[ "${error_lines[0]}" == "ERROR: $reference: manifest unknown" ]] \
                  || [[ "${error_lines[0]}" == "ERROR: $reference: name unknown" ]]
              }; then
                rm -f "$error_file"
              else
                cat "$error_file" >&2
                rm -f "$error_file"
                return 1
              fi
            fi
          }
          check_existing_tag "$IMAGE:$VERSION"
          check_existing_tag "$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$DIGEST"
          [[ "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')" == "$DIGEST" ]]
          [[ "$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{ .Manifest.Digest }}')" == "$DIGEST" ]]
      - name: Export verified release outputs
        id: result
        env:
          SBOM_ARTIFACT: sbom-${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SBOM_ARTIFACT" =~ ^sbom-[0-9a-f]{40}$ ]]
          {
            printf 'image-digest=%s\n' "$DIGEST"
            printf 'image-reference=%s@%s\n' "$IMAGE" "$DIGEST"
            printf 'sbom-artifact=%s\n' "$SBOM_ARTIFACT"
          } >> "$GITHUB_OUTPUT"
