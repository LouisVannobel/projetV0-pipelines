name: Reusable SaaS CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Exact Node.js major used by the SaaS
        type: string
        default: "24"
      pnpm-version:
        description: Exact stable pnpm version used by the SaaS
        type: string
        default: "11.21.0"
      working-directory:
        description: Directory containing package.json and pnpm-lock.yaml
        type: string
        default: "."
      run-a11y:
        description: Run the Playwright test:a11y script
        type: boolean
        default: true
      run-container:
        description: Build and vulnerability-scan the production Dockerfile
        type: boolean
        default: true
      docker-context:
        description: Docker build context
        type: string
        default: "."
      dockerfile:
        description: Production multi-stage Dockerfile
        type: string
        default: "Dockerfile"
      image-name:
        description: Local-only image name used during CI
        type: string
        default: "studio-saas"

permissions:
  contents: read

jobs:
  secrets-and-source:
    name: Secrets and source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          config=()
          [[ ! -f .gitleaks.toml ]] || config=(--config .gitleaks.toml)
          "$RUNNER_TEMP/gitleaks" detect --source . "${config[@]}" --redact --no-banner --exit-code 1
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret,license'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  quality:
    name: TypeScript quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Audit PR changes with Fallow
        if: github.event_name == 'pull_request'
        run: pnpm exec fallow audit --no-css --base "${{ github.event.pull_request.base.sha }}"
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit and integration tests
        run: pnpm run test
      - name: Production build
        run: pnpm run build

  accessibility:
    name: WCAG smoke tests
    if: inputs.run-a11y
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run axe-core through Playwright
        run: pnpm run test:a11y

  container:
    name: Build and scan production image
    if: inputs.run-container
    needs: [secrets-and-source, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: 'v0.36.1'
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build local image only
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ inputs.image-name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'image'
          image-ref: '${{ inputs.image-name }}:ci-${{ github.sha }}'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs: [secrets-and-source, quality, accessibility, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce CI dependency results
        env:
          SECRETS_AND_SOURCE_RESULT: ${{ needs.secrets-and-source.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$SECRETS_AND_SOURCE_RESULT" in
            success) ;;
            *) echo "secrets-and-source result was $SECRETS_AND_SOURCE_RESULT"; exit 1 ;;
          esac
          case "$QUALITY_RESULT" in
            success) ;;
            *) echo "quality result was $QUALITY_RESULT"; exit 1 ;;
          esac
          for result in "$ACCESSIBILITY_RESULT" "$CONTAINER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "optional CI result was $result"; exit 1 ;;
            esac
          done
