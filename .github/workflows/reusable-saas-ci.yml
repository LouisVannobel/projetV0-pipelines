name: Reusable SaaS CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Exact Node.js major used by the SaaS
        type: string
        default: "24"
      pnpm-version:
        description: Exact stable pnpm version used by the SaaS
        type: string
        default: "11.21.0"
      working-directory:
        description: Directory containing package.json and pnpm-lock.yaml
        type: string
        default: "."
      run-a11y:
        description: Run the Playwright test:a11y script
        type: boolean
        default: true
      run-container:
        description: Build and vulnerability-scan the production Dockerfile
        type: boolean
        default: true
      docker-context:
        description: Docker build context
        type: string
        default: "."
      dockerfile:
        description: Production multi-stage Dockerfile
        type: string
        default: "Dockerfile"
      image-name:
        description: Local-only image name used during CI
        type: string
        default: "studio-saas"

permissions:
  contents: read

jobs:
  secrets-and-source:
    name: Secrets and source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          config=()
          [[ ! -f .gitleaks.toml ]] || config=(--config .gitleaks.toml)
          "$RUNNER_TEMP/gitleaks" detect --source . "${config[@]}" --redact --no-banner --exit-code 1
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret,license'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  quality:
    name: TypeScript quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Production build
        run: pnpm run build
      - name: Unit and integration tests
        id: source-tests
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'started=%s\n' "$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          pnpm run test
      - name: Validate measured coverage when configured
        env:
          COVERAGE_TEST_STARTED: ${{ steps.source-tests.outputs.started }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'COVERAGE'
          import fs from 'node:fs';
          import path from 'node:path';
          const demand = (ok, code) => { if (!ok) throw new Error(`Invalid current source coverage: ${code}`); };
          const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          const root = fs.realpathSync('.');
          const ownedFile = target => {
            const absolute = path.resolve(target);
            demand(absolute.startsWith(root + path.sep), 'checkout-path');
            let cursor = absolute;
            while (cursor !== root) {
              demand(!fs.lstatSync(cursor).isSymbolicLink(), 'linked-path');
              cursor = path.dirname(cursor);
            }
            const stat = fs.statSync(absolute);
            demand(stat.isFile() && fs.realpathSync(absolute) === absolute, 'regular-file');
            return stat;
          };
          const configPath = path.join(root, '.fallowrc.json');
          if (!fs.existsSync(configPath)) {
            console.log('Measured coverage not configured; existing test script retained.');
          } else {
            demand(ownedFile(configPath).size <= 1024 * 1024, 'config-size');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            demand(object(config) && (config.health === undefined || object(config.health)), 'config-shape');
            const configured = config.health?.coverage;
            if (configured === undefined || configured === null) {
              console.log('Measured coverage not configured; existing test script retained.');
            } else {
              demand(typeof configured === 'string' && configured.length > 0 && configured.length <= 2048 && !path.isAbsolute(configured), 'report-path');
              const report = path.resolve(root, configured);
              const stat = ownedFile(report);
              const started = Number(process.env.COVERAGE_TEST_STARTED);
              demand(Number.isSafeInteger(started) && started > 0 && started <= Date.now() && stat.mtimeMs >= started && stat.mtimeMs <= Date.now(), 'current-producer');
              demand(stat.size > 0 && stat.size <= 64 * 1024 * 1024, 'report-size');
              const coverage = JSON.parse(fs.readFileSync(report, 'utf8'));
              demand(object(coverage) && Object.keys(coverage).length > 0, 'coverage-map');
              let statements = 0, functions = 0;
              const sourcePaths = new Set();
              for (const [filename, entry] of Object.entries(coverage)) {
                const absolute = path.resolve(filename);
                demand(object(entry) && path.isAbsolute(filename) && (filename === absolute || process.platform === 'win32' && filename === absolute.replaceAll('\\', '/')) && entry.path === filename, 'canonical-path');
                demand(!sourcePaths.has(absolute), 'duplicate-source');
                sourcePaths.add(absolute);
                const sourceStat = ownedFile(absolute);
                demand(sourceStat.size <= 16 * 1024 * 1024 && sourceStat.mtimeMs <= stat.mtimeMs, 'current-source');
                const lines = fs.readFileSync(absolute, 'utf8').split(/\r?\n/);
                const point = (value, end = false) => object(value) && Number.isSafeInteger(value.line) && value.line >= 1 && value.line <= lines.length && (end && value.column === null || Number.isSafeInteger(value.column) && value.column >= 0 && value.column <= lines[value.line - 1].length);
                const location = value => {
                  if (!object(value) || !point(value.start) || !point(value.end, true)) return false;
                  const endColumn = value.end.column === null ? lines[value.end.line - 1].length : value.end.column;
                  return value.end.line > value.start.line || value.end.line === value.start.line && endColumn >= value.start.column;
                };
                const implicitElse = (range, index, map) => index === 1 && map.type === 'if' && map.locations.length === 2 && object(range) && Object.keys(range).length === 2 && object(range.start) && Object.keys(range.start).length === 0 && object(range.end) && Object.keys(range.end).length === 0;
                const count = value => Number.isSafeInteger(value) && value >= 0;
                for (const [maps, counters] of [['statementMap', 's'], ['fnMap', 'f'], ['branchMap', 'b']]) {
                  demand(object(entry[maps]) && object(entry[counters]), 'maps-and-counters');
                  const keys = Object.keys(entry[maps]);
                  demand(keys.length === Object.keys(entry[counters]).length && keys.every(key => /^\d+$/.test(key) && Object.hasOwn(entry[counters], key)), 'counter-identities');
                  for (const key of keys) {
                    const map = entry[maps][key], value = entry[counters][key];
                    if (maps === 'statementMap') {
                      demand(location(map) && count(value), 'statement');
                      statements++;
                    } else if (maps === 'fnMap') {
                      demand(object(map) && typeof map.name === 'string' && location(map.decl) && location(map.loc) && count(value), 'function');
                      functions++;
                    } else {
                      demand(object(map) && typeof map.type === 'string' && map.type.length > 0 && location(map.loc) && Array.isArray(map.locations) && map.locations.length > 0 && map.locations.every((range, index) => location(range) || implicitElse(range, index, map)) && Array.isArray(value) && value.length === map.locations.length && value.every(count), 'branch');
                    }
                  }
                }
              }
              demand(statements > 0 && functions > 0, 'mapped-source');
              console.log(`Current Istanbul source coverage admitted: ${Object.keys(coverage).length} files, ${statements} statements, ${functions} functions.`);
            }
          }
          COVERAGE
      - name: Audit PR changes with Fallow
        if: github.event_name == 'pull_request'
        run: pnpm exec fallow audit --no-css --base "${{ github.event.pull_request.base.sha }}"
      - name: React Doctor advisory
        if: github.event_name == 'pull_request'
        run: pnpm run doctor --scope changed --base "${{ github.event.pull_request.base.sha }}"
      - name: Typecheck
        run: pnpm run typecheck

  accessibility:
    name: WCAG smoke tests
    if: inputs.run-a11y
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run axe-core through Playwright
        run: pnpm run test:a11y

  container:
    name: Build and scan production image
    if: inputs.run-container
    needs: [secrets-and-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: 'v0.37.2'
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build local image only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ inputs.image-name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'image'
          image-ref: '${{ inputs.image-name }}:ci-${{ github.sha }}'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs: [secrets-and-source, quality, accessibility, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce CI dependency results
        env:
          SECRETS_AND_SOURCE_RESULT: ${{ needs.secrets-and-source.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          RUN_A11Y: ${{ inputs.run-a11y }}
          RUN_CONTAINER: ${{ inputs.run-container }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$SECRETS_AND_SOURCE_RESULT" in
            success) ;;
            *) echo "secrets-and-source result was $SECRETS_AND_SOURCE_RESULT"; exit 1 ;;
          esac
          case "$QUALITY_RESULT" in
            success) ;;
            *) echo "quality result was $QUALITY_RESULT"; exit 1 ;;
          esac
          case "$RUN_A11Y:$ACCESSIBILITY_RESULT" in
            true:success|false:skipped) ;;
            *) echo "accessibility enabled=$RUN_A11Y result=$ACCESSIBILITY_RESULT"; exit 1 ;;
          esac
          case "$RUN_CONTAINER:$CONTAINER_RESULT" in
            true:success|false:skipped) ;;
            *) echo "container enabled=$RUN_CONTAINER result=$CONTAINER_RESULT"; exit 1 ;;
          esac
